<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Craig Keeps the Keys: 6-Page Edition V2</title>
  <style>
    @font-face {
      font-family: "Brice Black";
      src: url("../craig-self-custody-comic/assets/Brice-Black.otf") format("opentype");
      font-display: swap;
    }

    @font-face {
      font-family: "Mundial";
      src: url("../craig-self-custody-comic/assets/Mundial-Regular.otf") format("opentype");
      font-display: swap;
    }

    @font-face {
      font-family: "Mundial";
      src: url("../craig-self-custody-comic/assets/Mundial-Bold.otf") format("opentype");
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --page-w: 1440px;
      --page-h: 2160px;
      --ink: #111;
      --paper: #fff9e9;
      --gold: #ffe34d;
      --caption: #f6bd3f;
      --gutters: 16px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: var(--ink);
      font-family: "Mundial", Arial, sans-serif;
    }

    body.single {
      width: var(--page-w);
      height: var(--page-h);
      overflow: hidden;
      background: #000;
    }

    body.book {
      display: grid;
      gap: 40px;
      justify-content: center;
      padding: 40px;
    }

    .page {
      position: relative;
      width: var(--page-w);
      height: var(--page-h);
      overflow: hidden;
      background: #000;
      box-shadow: 0 24px 70px rgb(0 0 0 / 0.42);
    }

    body.single .page { box-shadow: none; }

    .cover-page { background: #090c0d; }

    .cover-backdrop {
      position: absolute;
      inset: -80px;
      background: url("assets/page-01-freedom-to-transact.jpeg") 68% center / cover no-repeat;
      filter: blur(30px) brightness(0.7) saturate(1.35);
      transform: scale(1.08);
    }

    .cover-shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgb(0 0 0 / 0.8) 0 18%, rgb(0 0 0 / 0.16) 37% 62%, rgb(0 0 0 / 0.56) 82% 100%),
        linear-gradient(90deg, rgb(0 0 0 / 0.18), transparent 48%, rgb(0 0 0 / 0.18));
    }

    .cover-art-frame {
      position: absolute;
      left: 24px;
      top: 470px;
      width: 1392px;
      height: 779px;
      overflow: hidden;
      border: 8px solid #050505;
      outline: 7px solid var(--gold);
      box-shadow: 0 24px 55px rgb(0 0 0 / 0.58);
    }

    .cover-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: var(--gutters);
      padding: var(--gutters);
      background: #000;
    }

    .panel {
      position: relative;
      overflow: hidden;
      background-image: var(--src);
      background-size: 200% 300%;
      background-position: var(--pos);
      background-repeat: no-repeat;
    }

    .panel.tone::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgb(0 0 0 / 0.09), transparent 43%, rgb(0 0 0 / 0.08));
      pointer-events: none;
    }

    .title-lockup {
      position: absolute;
      left: 68px;
      top: 70px;
      max-width: 940px;
      margin: 0;
      color: var(--gold);
      font-family: "Brice Black", Impact, sans-serif;
      font-size: 112px;
      line-height: 0.86;
      text-transform: uppercase;
      text-shadow: 6px 6px 0 #000, 11px 11px 0 rgb(0 0 0 / 0.3);
    }

    .short-tag {
      position: absolute;
      right: 58px;
      top: 72px;
      padding: 12px 18px 10px;
      border: 5px solid var(--gold);
      background: #050505;
      color: var(--gold);
      font-family: "Brice Black", Impact, sans-serif;
      font-size: 21px;
      text-transform: uppercase;
    }

    .subtitle {
      position: absolute;
      left: 70px;
      right: 70px;
      bottom: 130px;
      padding: 34px 34px 29px;
      border: 7px solid #fff;
      background: rgb(7 7 7 / 0.94);
      color: var(--gold);
      font-family: "Brice Black", Impact, sans-serif;
      font-size: 58px;
      line-height: 0.98;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 #000;
    }

    .caption,
    .bubble,
    .final-card {
      position: absolute;
      z-index: 2;
      border: 5px solid #0b0b0b;
      color: #111;
      filter: drop-shadow(7px 8px 0 rgb(0 0 0 / 0.28));
    }

    .caption {
      left: 10%;
      top: 8%;
      width: 80%;
      padding: 14px 18px 12px;
      border-radius: 4px;
      background: var(--caption);
      font-family: "Brice Black", Impact, sans-serif;
      font-size: 29px;
      line-height: 1;
      text-transform: uppercase;
      text-align: center;
    }

    .bubble {
      left: 8%;
      top: 8%;
      width: 84%;
      min-height: 78px;
      padding: 16px 20px 14px;
      border-radius: 38px / 28px;
      background: var(--paper);
      font-family: "Mundial", Arial, sans-serif;
      font-weight: 700;
      font-size: 28px;
      line-height: 1.05;
      text-align: center;
    }

    .final-card {
      left: 7%;
      right: 7%;
      bottom: 7%;
      padding: 18px 22px 16px;
      border-radius: 8px;
      background: #080808;
      color: var(--gold);
      font-family: "Brice Black", Impact, sans-serif;
      font-size: 34px;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 #000;
    }

    .page-num {
      position: absolute;
      right: 28px;
      bottom: 18px;
      z-index: 3;
      padding: 4px 9px;
      border: 3px solid #111;
      background: #fff;
      color: #111;
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main id="book"></main>

  <script>
    const art = (page) => `url("generated-art/${page}")`;
    const pos = {
      tl: "left top",
      tr: "right top",
      ml: "left center",
      mr: "right center",
      bl: "left bottom",
      br: "right bottom",
    };

    const sheet = (name, texts) => texts.map((entry, index) => [
      name,
      Object.keys(pos)[index],
      entry[0],
      entry[1],
    ]);

    const pages = [
      {
        number: 1,
        cover: "assets/page-01-freedom-to-transact.jpeg",
      },
      {
        number: 2,
        panels: sheet("page-02-art.png", [
          ["caption", "Craig loved his game world."],
          ["bubble", "His friends built a clubhouse together."],
          ["caption", "Then the company shut it down."],
          ["bubble", "The gear, name, and team vanished."],
          ["bubble", "No one should erase our lives."],
          ["bubble", "Craig drew a new game players could run together."],
        ]),
      },
      {
        number: 3,
        panels: sheet("page-03-art.png", [
          ["bubble", "Craig found 6529: people building together online."],
          ["bubble", "Craig created a meme card to fund his community!"],
          ["caption", "But Craig moved too fast."],
          ["bubble", "Secret words never go where eyes can see."],
          ["bubble", "Not every shiny site is safe."],
          ["bubble", "Punk6529 arrived: pause, Craig."],
        ]),
      },
      {
        number: 4,
        panels: sheet("page-04-art.png", [
          ["bubble", "Your private key is like one key to your treasure."],
          ["bubble", "Whoever gets it can take your stuff."],
          ["bubble", "Keep seed words offline and private."],
          ["bubble", "A hardware wallet keeps the key off your computer."],
          ["bubble", "Check the little screen before you approve."],
          ["bubble", "Even malware cannot grab the key inside."],
        ]),
      },
      {
        number: 5,
        panels: sheet("page-05-art.png", [
          ["caption", "TAP means three addresses."],
          ["bubble", "A is the vault. Treasures live there."],
          ["bubble", "B is for trusted buying and selling."],
          ["bubble", "C is for minting and unknown sites."],
          ["bubble", "A Safe can need more than one key."],
          ["bubble", "One stolen key is not enough."],
        ]),
      },
      {
        number: 6,
        panels: sheet("page-06-art.png", [
          ["bubble", "Freedom to transact means people can trade and build."],
          ["bubble", "If one boss can block everyone, freedom is weak."],
          ["bubble", "Craig's new arena is owned by the players."],
          ["bubble", "Members vote on the next move together."],
          ["bubble", "Craig set up his 6529 account with TAP."],
          ["final", "Now Craig and his friends can build a world no single boss controls."],
        ]),
      },
    ];

    const params = new URLSearchParams(window.location.search);
    const requestedPage = Number(params.get("page"));
    const visiblePages = Number.isInteger(requestedPage) && requestedPage > 0
      ? pages.filter((page) => page.number === requestedPage)
      : pages;
    const book = document.getElementById("book");

    document.body.className = visiblePages.length === 1 ? "single" : "book";

    for (const page of visiblePages) {
      const pageEl = document.createElement("section");
      pageEl.className = page.cover ? "page cover-page" : "page";
      pageEl.setAttribute("aria-label", `Page ${page.number}`);

      if (page.cover) {
        const backdrop = document.createElement("div");
        backdrop.className = "cover-backdrop";
        pageEl.append(backdrop);

        const shade = document.createElement("div");
        shade.className = "cover-shade";
        pageEl.append(shade);

        const frame = document.createElement("div");
        frame.className = "cover-art-frame";
        const img = document.createElement("img");
        img.className = "cover-art";
        img.src = page.cover;
        img.alt = "Punk6529 teaching Freedom to Transact in a classroom";
        frame.append(img);
        pageEl.append(frame);

        const tag = document.createElement("div");
        tag.className = "short-tag";
        tag.textContent = "6-page edition";
        pageEl.append(tag);

        const title = document.createElement("h1");
        title.className = "title-lockup";
        title.textContent = "Craig Keeps the Keys";
        pageEl.append(title);

        const subtitle = document.createElement("div");
        subtitle.className = "subtitle";
        subtitle.textContent = "A short comic on self-custody, TAP, and freedom to transact";
        pageEl.append(subtitle);
      } else {
        const grid = document.createElement("div");
        grid.className = "grid";
        for (const [src, panelPos, kind, text] of page.panels) {
          const panel = document.createElement("article");
          panel.className = "panel tone";
          panel.style.setProperty("--src", art(src));
          panel.style.setProperty("--pos", pos[panelPos]);

          const label = document.createElement("div");
          label.className = kind === "caption" ? "caption" : kind === "final" ? "final-card" : "bubble";
          label.textContent = text;
          panel.append(label);
          grid.append(panel);
        }
        pageEl.append(grid);
      }

      const pageNum = document.createElement("div");
      pageNum.className = "page-num";
      pageNum.textContent = String(page.number).padStart(2, "0");
      pageEl.append(pageNum);
      book.append(pageEl);
    }
  </script>
</body>
</html>
